plugins { id 'com.android.application' }

android {
    namespace 'com.equinumcloud.lite'
    compileSdk 36
    defaultConfig {
        applicationId 'com.equinumcloud.lite'     // never changes after the first upload
        minSdk 26
        targetSdk 36                              // Google Play: new apps must target API 36
        versionCode 3
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes {
        release {
            minifyEnabled true                    // R8: removes unused code and renames the app's own classes
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging false } }   // libraries stay uncompressed and 16 KB aligned in the app bundle
}
